services:
  annotations:
    build: .
    container_name: annotations
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./data:/app/data
    environment:
      - KVSTORE_URL=https://kvstore.mooc.ca
      - DATABASE_URL=/app/data/annotations.db
      - BASE_URL=https://annotations.mooc.ca
    networks:
      - web

networks:
  web:
    external: true
